# Static analysis and unit tests for the driver app.
#
# This repository had no CI at all, which meant every change to the app was
# unverified until someone happened to run `flutter test` locally. That is a poor
# position for the app that issues trip lifecycle commands: the reliability work
# following the sustained-GPS pilot blocker lives in this repository, and its
# correctness cannot rest on whether a developer remembered.
name: flutter

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Formatting is checked but not enforced as a failure: a reformat of the
      # whole tree is a separate, reviewable change, not something CI should
      # spring on an unrelated commit.
      - name: Check formatting (informational)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded
