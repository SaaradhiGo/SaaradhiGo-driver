# Static analysis and unit tests for the driver app.
#
# This repository had no CI at all, which meant every change to the app was
# unverified until someone happened to run `flutter test` locally. That is a poor
# position for the app that issues trip lifecycle commands: the reliability work
# following the sustained-GPS pilot blocker lives in this repository, and its
# correctness cannot rest on whether a developer remembered.
name: flutter

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Formatting is checked but not enforced as a failure: a reformat of the
      # whole tree is a separate, reviewable change, not something CI should
      # spring on an unrelated commit.
      - name: Check formatting (informational)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  # A build is a different gate from a test.
  #
  # `flutter test` runs on the Dart VM and proves nothing about whether the app
  # compiles for Android. For the app that issues trip lifecycle commands, "it
  # compiles for a handset" is the minimum before anyone is asked to drive with
  # it, and until now no APK had ever been produced by anything.
  #
  # Debug build: it needs no signing secrets, and android/app/build.gradle.kts
  # already uses the debug signing config for release, so a "release" artifact
  # here would be debug-signed and the name would mislead.
  #
  # NOTE ON PUSH NOTIFICATIONS. This app depends on firebase_messaging, but the
  # com.google.gms.google-services plugin is commented out in
  # android/app/build.gradle.kts because android/app/google-services.json is
  # absent. Firebase.initializeApp() therefore throws at runtime, PushService
  # catches it and sets _ready = false, and the app registers no FCM token. The
  # APK this job produces builds and runs, and it CANNOT receive a background ride
  # offer. That is a configuration gap to close before a pilot, not a build
  # problem, and it is why this job does not pretend to verify notifications.
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Report artifact size
        run: ls -lh build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: driver-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
