# Checks on every pull request and on pushes to dev: flutter analyze, flutter test
# and a secret scan. (No build here: the debug APK and release-config gates live in
# the separate `flutter` workflow on feature branches.)
name: ci

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the repo builds and tests with today (pubspec.lock needs
      # Flutter >= 3.44 / Dart >= 3.13). Move it deliberately, not with `stable`.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # pubspec.yaml lists .env as an asset; it is gitignored, so build it from the example.
      - name: Create the .env asset from the example
        run: cp .env.example .env

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: flutter test

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over the commits this run introduces
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            RANGE="$HEAD~1..$HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          echo "scanning $RANGE"
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --config /repo/.gitleaks.toml --log-opts="$RANGE" \
            --redact --no-banner --exit-code 1
