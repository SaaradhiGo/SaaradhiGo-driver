name: saaradhigo_driver
description: "SaaradhiGo Drive — the driver-side app for the SaaradhiGo ride-hailing platform."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # --- State + navigation ---------------------------------------------------
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0

  # --- Networking -----------------------------------------------------------
  dio: ^5.7.0
  web_socket_channel: ^3.0.1

  # --- Storage --------------------------------------------------------------
  # Tokens live in the Keychain / EncryptedSharedPreferences, never in plain
  # SharedPreferences. Non-secret state (last trip snapshot, settings) uses
  # SharedPreferences.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.0

  # --- Maps + location ------------------------------------------------------
  google_maps_flutter: ^2.9.0
  geolocator: ^14.0.0
  flutter_polyline_points: ^3.0.1
  url_launcher: ^6.3.0

  # --- Background execution -------------------------------------------------
  # A driver's location must keep flowing while the app is backgrounded or
  # the screen is off. On Indian OEM builds (Xiaomi, Vivo, Oppo, Realme) a
  # foreground service is the difference between a working app and one that
  # silently stops receiving dispatch.
  flutter_background_service: ^5.0.10
  flutter_local_notifications: ^18.0.0
  permission_handler: ^11.3.1

  # --- Push -----------------------------------------------------------------
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # --- Misc -----------------------------------------------------------------
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
